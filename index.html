<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CJ FLEXX — Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0B0F; --surface:#16161C; --surface2:#1F1F27; --surface3:#282833;
    --border:#2A2A34; --text:#F4F4F6; --dim:#9A9AA8; --dim2:#6C6C7A;
    --brand:#8B5CF6; --brand-hi:#A78BFA; --brand-deep:#7C3AED;
    --green:#22C55E; --green-bg:rgba(34,197,94,.13);
    --yellow:#EAB308; --yellow-bg:rgba(234,179,8,.13);
    --red:#EF4444; --red-bg:rgba(239,68,68,.13);
    --blue:#38BDF8;
    --wa:#25D366;
    --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text);
    font-family:'Inter',system-ui,sans-serif; font-size:15px; line-height:1.5;
    -webkit-font-smoothing:antialiased; padding-bottom:90px;
  }
  ::selection{background:var(--brand);color:#fff}
  h1,h2,h3,.oswald{font-family:'Oswald',sans-serif;font-weight:600;letter-spacing:.3px}
  .num{font-family:'Oswald',sans-serif;font-weight:600;font-variant-numeric:tabular-nums}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select,textarea{font-family:inherit;font-size:15px}

  /* Top bar */
  .topbar{
    position:sticky;top:0;z-index:40;background:rgba(11,11,15,.85);
    backdrop-filter:blur(12px);border-bottom:1px solid var(--border);
    padding:14px 18px;display:flex;align-items:center;justify-content:space-between;
  }
  .logo{font-family:'Oswald';font-weight:700;font-size:22px;letter-spacing:1.5px;text-transform:uppercase}
  .logo b{color:var(--brand-hi)}
  .top-right{display:flex;align-items:center;gap:10px}
  .demo-badge{
    font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;
    padding:4px 9px;border-radius:20px;background:var(--brand);color:#fff;
  }
  .reset-btn{color:var(--dim2);font-size:16px;padding:2px 6px;border-radius:8px}
  .reset-btn:hover{color:var(--text);background:var(--surface2)}

  .wrap{max-width:960px;margin:0 auto;padding:18px}

  /* Info banner */
  .hero{
    background:linear-gradient(135deg,rgba(139,92,246,.16),rgba(139,92,246,.04));
    border:1px solid rgba(139,92,246,.3);border-radius:var(--radius);
    padding:18px 20px;margin-bottom:20px;position:relative;
  }
  .hero h2{font-size:19px;margin-bottom:6px}
  .hero p{color:var(--dim);font-size:13.5px}
  .hero .close{position:absolute;top:12px;right:14px;color:var(--dim2);font-size:18px}

  /* Section titles */
  .sec-title{
    font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;
    color:var(--dim2);margin:26px 0 12px;display:flex;align-items:center;gap:8px;
  }
  .sec-title:first-child{margin-top:0}

  /* Cards */
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
  .grid{display:grid;gap:12px}
  .grid-2{grid-template-columns:repeat(2,1fr)}
  .grid-4{grid-template-columns:repeat(4,1fr)}

  /* Stat cards */
  .stat{padding:16px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface)}
  .stat .label{font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--dim);font-weight:600}
  .stat .val{font-family:'Oswald';font-size:34px;font-weight:600;margin-top:4px;line-height:1}
  .stat .sub{font-size:12px;color:var(--dim);margin-top:4px}
  .stat.accent{background:linear-gradient(135deg,rgba(139,92,246,.18),rgba(139,92,246,.03));border-color:rgba(139,92,246,.35)}
  .stat.accent .val{color:var(--brand-hi)}

  /* Client row */
  .client-row{
    display:flex;align-items:center;gap:12px;padding:14px 16px;
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    margin-bottom:10px;cursor:pointer;transition:.15s;
  }
  .client-row:hover{border-color:var(--brand);background:var(--surface2)}
  .avatar{
    width:44px;height:44px;border-radius:12px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    font-family:'Oswald';font-weight:600;font-size:17px;color:#fff;
  }
  .client-row .info{flex:1;min-width:0}
  .client-row .name{font-weight:600;font-size:15.5px}
  .client-row .meta{font-size:12.5px;color:var(--dim);margin-top:2px;display:flex;gap:10px;flex-wrap:wrap}
  .chev{color:var(--dim2);font-size:20px}

  /* Dots / semaforo */
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex-shrink:0}
  .dot.green{background:var(--green);box-shadow:0 0 8px rgba(34,197,94,.6)}
  .dot.yellow{background:var(--yellow);box-shadow:0 0 8px rgba(234,179,8,.6)}
  .dot.red{background:var(--red);box-shadow:0 0 8px rgba(239,68,68,.6)}

  /* Badges */
  .badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;letter-spacing:.4px;white-space:nowrap}
  .badge.green{background:var(--green-bg);color:#6EE7A0}
  .badge.yellow{background:var(--yellow-bg);color:#FACC48}
  .badge.red{background:var(--red-bg);color:#FF8A8A}
  .badge.blue{background:rgba(56,189,248,.13);color:#7DD3FC}
  .badge.gray{background:var(--surface3);color:var(--dim)}
  .badge.violet{background:rgba(139,92,246,.16);color:var(--brand-hi)}

  .pill{font-size:12px;padding:3px 10px;border-radius:20px;background:var(--surface3);color:var(--dim)}

  /* Buttons */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:7px;
    padding:11px 16px;border-radius:11px;font-weight:600;font-size:14px;transition:.15s;
  }
  .btn-primary{background:var(--brand);color:#fff}
  .btn-primary:hover{background:var(--brand-deep)}
  .btn-ghost{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
  .btn-ghost:hover{background:var(--surface3)}
  .btn-green{background:var(--green);color:#04240F}
  .btn-green:hover{filter:brightness(1.1)}
  .btn-wa{background:var(--wa);color:#04240F;font-weight:700}
  .btn-wa:hover{filter:brightness(1.08)}
  .btn-danger{background:var(--red-bg);color:#FF8A8A;border:1px solid rgba(239,68,68,.35)}
  .btn-sm{padding:8px 12px;font-size:13px}
  .btn-block{width:100%}
  .btn-yappy{background:#00A9E0;color:#fff;font-weight:700}
  .btn-yappy:hover{filter:brightness(1.08)}

  /* Detail */
  .back-btn{display:inline-flex;align-items:center;gap:6px;color:var(--dim);font-weight:600;font-size:14px;margin-bottom:16px}
  .back-btn:hover{color:var(--text)}
  .detail-head{display:flex;align-items:center;gap:14px;margin-bottom:6px}
  .detail-head .avatar{width:56px;height:56px;font-size:22px;border-radius:14px}
  .detail-head h1{font-size:26px}

  /* Metric grid */
  .metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .metric{background:var(--surface2);border:1px solid var(--border);border-radius:11px;padding:12px}
  .metric.alert-red{background:var(--red-bg);border-color:rgba(239,68,68,.4)}
  .metric.alert-yellow{background:var(--yellow-bg);border-color:rgba(234,179,8,.4)}
  .metric .m-label{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.3px;font-weight:600}
  .metric .m-val{font-family:'Oswald';font-size:24px;font-weight:600;margin-top:3px;line-height:1}
  .metric .m-flag{font-size:10.5px;font-weight:700;margin-top:4px}
  .flag-red{color:#FF8A8A}.flag-yellow{color:#FACC48}

  /* Progress chips */
  .prog-chip{display:flex;align-items:center;gap:8px;padding:11px 13px;border-radius:11px;font-weight:600}
  .prog-good{background:var(--green-bg);color:#6EE7A0}
  .prog-bad{background:var(--red-bg);color:#FF8A8A}
  .prog-chip .p-val{font-family:'Oswald';font-size:19px;margin-left:auto}

  /* History */
  .hist-item{display:flex;align-items:center;gap:12px;padding:11px 14px;background:var(--surface2);border-left:2px solid var(--brand);border-radius:9px;margin-bottom:8px}
  .hist-item .h-date{font-weight:600;font-size:13.5px}
  .hist-item .h-data{font-size:12px;color:var(--dim);margin-top:2px}

  /* Alert box */
  .alert-box{display:flex;gap:10px;padding:13px 15px;border-radius:11px;margin-bottom:10px;align-items:flex-start}
  .alert-box.danger{background:var(--red-bg);border:1px solid rgba(239,68,68,.35)}
  .alert-box.warn{background:var(--yellow-bg);border:1px solid rgba(234,179,8,.35)}
  .alert-box .a-icon{font-size:16px;line-height:1.3}
  .alert-box .a-text{font-size:13.5px}
  .alert-box .a-text b{font-weight:700}

  /* Rutinas */
  .tpl-row{
    display:flex;align-items:center;gap:12px;padding:14px 16px;
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    margin-bottom:10px;transition:.15s;
  }
  .tpl-row:hover{border-color:var(--brand)}
  .tpl-icon{
    width:44px;height:44px;border-radius:12px;flex-shrink:0;font-size:20px;
    display:flex;align-items:center;justify-content:center;
    background:rgba(139,92,246,.16);
  }
  .tpl-row .info{flex:1;min-width:0}
  .tpl-row .name{font-weight:600;font-size:15.5px}
  .tpl-row .meta{font-size:12.5px;color:var(--dim);margin-top:2px}
  .tpl-actions{display:flex;gap:6px}
  .icon-btn{
    width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;
    background:var(--surface2);border:1px solid var(--border);color:var(--dim);font-size:14px;
  }
  .icon-btn:hover{color:var(--text);background:var(--surface3)}
  .icon-btn.danger:hover{color:#FF8A8A;border-color:rgba(239,68,68,.4)}

  .day-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:12px}
  .day-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .day-head .day-tag{
    font-family:'Oswald';font-weight:600;font-size:13px;letter-spacing:.5px;color:var(--brand-hi);
    background:rgba(139,92,246,.14);padding:4px 10px;border-radius:8px;white-space:nowrap;
  }
  .day-head input{
    flex:1;background:transparent;border:none;border-bottom:1px dashed var(--border);
    color:var(--text);font-weight:600;font-size:15px;padding:4px 2px;outline:none;
  }
  .day-head input:focus{border-bottom-color:var(--brand)}
  .ex-row{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px}
  .ex-main{display:flex;align-items:center;gap:8px}
  .ex-name{flex:1;font-weight:600;font-size:14px;min-width:0}
  .ex-name .g{font-size:11px;color:var(--dim2);font-weight:500;margin-left:6px}
  .ex-inputs{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--dim)}
  .ex-inputs input{
    width:46px;background:var(--surface3);border:1px solid var(--border);border-radius:7px;
    padding:5px 4px;color:var(--text);text-align:center;font-size:13px;outline:none;
  }
  .ex-inputs input.wide{width:58px}
  .ex-inputs input:focus{border-color:var(--brand)}
  .ex-note{margin-top:7px}
  .ex-note input{
    width:100%;background:transparent;border:none;border-bottom:1px dashed var(--border);
    color:var(--dim);font-size:12.5px;padding:3px 2px;outline:none;
  }
  .ex-note input:focus{border-bottom-color:var(--brand);color:var(--text)}
  .ex-del{color:var(--dim2);font-size:15px;padding:4px 6px;border-radius:7px;flex-shrink:0}
  .ex-del:hover{color:#FF8A8A;background:var(--red-bg)}

  /* Rutina en detalle de cliente */
  .routine-day{background:var(--surface2);border-left:2px solid var(--brand);border-radius:9px;padding:11px 14px;margin-bottom:8px}
  .routine-day .rd-name{font-weight:600;font-size:13.5px}
  .routine-day .rd-list{font-size:12.5px;color:var(--dim);margin-top:3px;line-height:1.6}

  /* Picker / biblioteca */
  .chip-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .chip{font-size:12px;font-weight:600;padding:6px 12px;border-radius:20px;background:var(--surface2);border:1px solid var(--border);color:var(--dim)}
  .chip.active{background:var(--brand);border-color:var(--brand);color:#fff}
  .pick-item{
    display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;
    background:var(--surface2);border:1px solid var(--border);margin-bottom:6px;cursor:pointer;
  }
  .pick-item:hover{border-color:var(--brand)}
  .pick-item .p-name{flex:1;font-weight:600;font-size:14px}
  .pick-item .p-group{font-size:11px;color:var(--dim2)}

  /* Bottom nav */
  .bottomnav{
    position:fixed;bottom:0;left:0;right:0;z-index:40;
    background:rgba(11,11,15,.9);backdrop-filter:blur(12px);border-top:1px solid var(--border);
    display:flex;justify-content:center;gap:6px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));
  }
  .nav-btn{
    flex:1;max-width:130px;display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:8px 4px;border-radius:11px;color:var(--dim2);font-size:11px;font-weight:600;transition:.15s;
  }
  .nav-btn .ni{font-size:19px}
  .nav-btn.active{color:var(--brand-hi);background:rgba(139,92,246,.12)}

  /* Modal */
  .modal-backdrop{
    position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.65);backdrop-filter:blur(4px);
    display:flex;align-items:center;justify-content:center;padding:18px;
  }
  .modal-card{
    background:var(--surface);border:1px solid var(--border);border-radius:18px;
    width:100%;max-width:440px;max-height:88vh;overflow-y:auto;padding:22px;
    animation:pop .18s ease;
  }
  @keyframes pop{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
  .modal-card h2{font-size:20px;margin-bottom:4px}
  .modal-card .m-sub{color:var(--dim);font-size:13px;margin-bottom:16px}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--dim);margin-bottom:5px;text-transform:uppercase;letter-spacing:.3px}
  .field input,.field select,.field textarea{
    width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:10px;
    padding:11px 12px;color:var(--text);outline:none;transition:.15s;
  }
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand)}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .msg-preview{
    background:var(--surface2);border:1px solid var(--border);border-radius:11px;
    padding:14px;font-size:14px;line-height:1.55;white-space:pre-wrap;margin-bottom:14px;color:#E6E6EA;
  }
  .yappy-sim{
    background:linear-gradient(160deg,#003A5C,#00161F);border:1px solid #00A9E0;
    border-radius:16px;padding:22px;text-align:center;margin-bottom:16px;
  }
  .yappy-sim .y-logo{font-family:'Oswald';font-weight:700;font-size:26px;color:#fff;letter-spacing:1px}
  .yappy-sim .y-amount{font-family:'Oswald';font-size:40px;font-weight:600;color:#fff;margin:10px 0 2px}
  .yappy-sim .y-note{font-size:12.5px;color:#9FD8EE}
  .toast{
    position:fixed;bottom:100px;left:50%;transform:translateX(-50%);z-index:200;
    background:var(--green);color:#04240F;font-weight:600;font-size:13.5px;
    padding:11px 18px;border-radius:30px;box-shadow:0 8px 24px rgba(0,0,0,.4);
    animation:toastIn .2s ease;
  }
  @keyframes toastIn{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}

  .empty{text-align:center;padding:40px 20px;color:var(--dim)}
  .divider{height:1px;background:var(--border);margin:18px 0}
  .fab-row{display:flex;gap:10px;margin-top:8px}

  @media(max-width:560px){
    .grid-4{grid-template-columns:repeat(2,1fr)}
    .metrics{grid-template-columns:repeat(2,1fr)}
    .detail-head h1{font-size:22px}
    .ex-main{flex-wrap:wrap}
    .ex-inputs{width:100%;justify-content:flex-end}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">CJ <b>FLEXX</b></div>
  <div class="top-right">
    <button class="reset-btn" data-action="reset" title="Restablecer datos de ejemplo">↺</button>
    <div class="demo-badge">Demo</div>
  </div>
</div>

<div id="app" class="wrap"></div>
<div id="nav"></div>
<div id="modal"></div>
<div id="toast"></div>

<script>
/* ============================================================
   ESTADO — con persistencia en localStorage
   ============================================================ */
const today = new Date();
const dAgo   = n => { const d=new Date(today); d.setDate(d.getDate()-n); return d.toISOString(); };
const dAhead = n => { const d=new Date(today); d.setDate(d.getDate()+n); return d.toISOString(); };
const STORAGE_KEY = 'cjflexx_demo_v1';
const deepCopy = o => JSON.parse(JSON.stringify(o));

function seedExercises(){
  let id = 0;
  const mk = (group, names) => names.map(n => ({id:++id, name:n, group}));
  return [
    ...mk('Pecho',   ['Press de banca','Press inclinado con mancuernas','Aperturas con mancuernas','Fondos en paralelas','Flexiones de pecho']),
    ...mk('Espalda', ['Dominadas','Jalón al pecho','Remo con barra','Remo en máquina','Peso muerto','Pull-over con mancuerna']),
    ...mk('Pierna',  ['Sentadilla con barra','Prensa de pierna','Zancadas','Peso muerto rumano','Curl femoral','Extensión de cuádriceps','Elevación de talones','Hip thrust','Sentadilla búlgara']),
    ...mk('Hombro',  ['Press militar','Elevaciones laterales','Elevaciones frontales','Pájaros (deltoide posterior)','Face pull']),
    ...mk('Brazo',   ['Curl de bíceps con barra','Curl martillo','Extensión de tríceps en polea','Press francés','Fondos en banco']),
    ...mk('Core',    ['Plancha','Crunch abdominal','Elevación de piernas','Russian twist','Plancha lateral','Rueda abdominal']),
    ...mk('Cardio',  ['Caminata inclinada en cinta','Bicicleta estática','Remo ergómetro','Burpees','Saltar cuerda','Elíptica']),
  ];
}

// items de rutina: autocontenidos (nombre + grupo copiados de la biblioteca)
const it = (name, group, sets, reps, rest, note) => ({name, group, sets, reps, rest, note: note||''});

function seedTemplates(){
  return [
    {
      id:1, name:'Pérdida de grasa · 3 días', goal:'Quemar grasa manteniendo músculo',
      days:[
        {name:'Full body A', items:[
          it('Sentadilla con barra','Pierna',4,'12','75s'),
          it('Press de banca','Pecho',4,'12','75s'),
          it('Remo con barra','Espalda',4,'12','75s'),
          it('Plancha','Core',3,'45s','45s'),
          it('Burpees','Cardio',3,'15','60s','Ritmo constante, sin pausa arriba'),
        ]},
        {name:'Cardio + core', items:[
          it('Caminata inclinada en cinta','Cardio',1,'30min','—','Inclinación 10-12%, ritmo fuerte'),
          it('Crunch abdominal','Core',4,'20','45s'),
          it('Russian twist','Core',3,'20','45s'),
          it('Elevación de piernas','Core',3,'15','45s'),
        ]},
        {name:'Full body B', items:[
          it('Peso muerto rumano','Pierna',4,'10','90s'),
          it('Press militar','Hombro',4,'12','75s'),
          it('Jalón al pecho','Espalda',4,'12','75s'),
          it('Zancadas','Pierna',3,'12 c/pierna','60s'),
          it('Saltar cuerda','Cardio',4,'1min','45s'),
        ]},
      ]
    },
    {
      id:2, name:'Hipertrofia · 4 días', goal:'Ganar masa muscular',
      days:[
        {name:'Pecho + tríceps', items:[
          it('Press de banca','Pecho',4,'8-10','90s'),
          it('Press inclinado con mancuernas','Pecho',4,'10','90s'),
          it('Aperturas con mancuernas','Pecho',3,'12','60s'),
          it('Extensión de tríceps en polea','Brazo',4,'12','60s'),
          it('Press francés','Brazo',3,'10','60s'),
        ]},
        {name:'Espalda + bíceps', items:[
          it('Dominadas','Espalda',4,'al fallo','90s','Si no llegas a 8, usa banda de asistencia'),
          it('Remo con barra','Espalda',4,'8-10','90s'),
          it('Jalón al pecho','Espalda',3,'12','75s'),
          it('Curl de bíceps con barra','Brazo',4,'10','60s'),
          it('Curl martillo','Brazo',3,'12','60s'),
        ]},
        {name:'Pierna', items:[

const AVATAR_COLORS = ['#8B5CF6','#38BDF8','#EC4899','#F59E0B','#10B981','#6366F1'];
const avatarColor = id => AVATAR_COLORS[id % AVATAR_COLORS.length];

/* ============================================================
   LÓGICA DE NEGOCIO
   ============================================================ */
function daysSince(iso){ return Math.floor((today - new Date(iso)) / 86400000); }
function daysUntil(iso){ return Math.ceil((new Date(iso) - today) / 86400000); }
function fmtDate(d){
  const dt = new Date(d);
  return `${String(dt.getDate()).padStart(2,'0')}.${String(dt.getMonth()+1).padStart(2,'0')}.${dt.getFullYear()}`;
}
function bmi(reading, client){ return reading.weight / Math.pow(client.height/100, 2); }

// Progreso entre las dos últimas mediciones
function progress(c){
  if(c.readings.length < 2) return null;
  const a = c.readings[c.readings.length-1];   // reciente
  const b = c.readings[c.readings.length-2];   // anterior
  return {
    weight: +(a.weight - b.weight).toFixed(1),
    fat:    +(a.fat - b.fat).toFixed(1),
    muscle: +(a.muscle - b.muscle).toFixed(1),
  };
}
// Nivel de progreso
function level(c){
  if(c.readings.length < 2) return {key:'SIN DATOS', cls:'gray', icon:'📊'};
  const p = progress(c);
  let good = 0;
  if(p.weight < 0) good++;
  if(p.fat < 0) good++;
  if(p.muscle > 0) good++;
  if(good >= 3) return {key:'EXCELENTE', cls:'green', icon:'🏆'};
  if(good === 2) return {key:'BUENO', cls:'green', icon:'⭐'};
  if(good === 1) return {key:'EN PROCESO', cls:'yellow', icon:'⚡'};
  return {key:'INICIANDO', cls:'red', icon:'🔥'};
}
function isStagnant(c){
  if(c.readings.length < 2) return false;
  const p = progress(c);
  return p.weight >= 0 && p.fat >= 0 && p.muscle <= 0;
}
// Estado de pago
function payStatus(c){
  const d = daysUntil(c.nextPayment);
  if(d < 0) return {key:'vencido', cls:'red', label:`Vencido hace ${Math.abs(d)}d`};
  if(d <= 7) return {key:'pronto', cls:'yellow', label:`Vence en ${d}d`};
  return {key:'aldia', cls:'green', label:`Al día · ${d}d`};
}
// Churn score
function churn(c){
  const d = daysSince(c.lastActivity);
  let pts = 0;
  if(d > 14) pts += 2; else if(d > 7) pts += 1;
  if(payStatus(c).key === 'vencido') pts += 2;
  if(isStagnant(c)) pts += 1;
  if(pts >= 3) return {key:'ALTO', cls:'red', dot:'red', days:d};
  if(pts >= 1) return {key:'MEDIO', cls:'yellow', dot:'yellow', days:d};
  return {key:'BAJO', cls:'green', dot:'green', days:d};
}
// Alertas de salud sobre la última medición
function healthAlerts(c){
  const r = c.readings[c.readings.length-1];
  if(!r) return [];
  const out = [];
  if(r.visceral >= 7) out.push({sev:'danger', text:`Grasa visceral en <b>nivel ${r.visceral}</b> (alto, ideal ≤6)`});
  const b = bmi(r, c);
  if(b >= 25) out.push({sev:'warn', text:`IMC <b>${b.toFixed(1)}</b> por encima del rango saludable`});
  else if(b < 18.5) out.push({sev:'warn', text:`IMC <b>${b.toFixed(1)}</b> por debajo del rango saludable`});
  return out;
}
function mrr(){ return state.clients.reduce((s,c)=>s+c.fee,0); }

function waLink(phone, text){
  return `https://wa.me/${phone.replace(/\D/g,'')}?text=${encodeURIComponent(text)}`;

function openWA(phone, text){

function routineText(c){
  const r = c.routine;
  const first = c.name.split(' ')[0];
  let t = `💪 *RUTINA — ${r.name.toUpperCase()}*\n`;
  t += `Hola ${first}, aquí tienes tu rutina:\n`;
  if(r.goal) t += `🎯 Objetivo: ${r.goal}\n`;
  r.days.forEach((d, i)=>{
    t += `\n📅 *DÍA ${i+1} · ${d.name}*\n`;
    d.items.forEach((x, j)=>{
      t += `${j+1}. ${x.name} — ${x.sets}x${x.reps}${x.rest && x.rest!=='—' ? ` · desc. ${x.rest}` : ''}\n`;
      if(x.note) t += `   👉 ${x.note}\n`;
    });
  });
  t += `\nCualquier duda me escribes. ¡Vamos con todo! 🔥 — CJ FLEXX`;
  return t;
}

// Fila de cliente con contexto variable
function clientRow(c, mode){
  const ch = churn(c), lv = level(c), ps = payStatus(c);
  let right = `<span class="chev">›</span>`;
  let meta = '';
  if(mode==='churn'){
    meta = `<span><span class="dot ${ch.dot}"></span> Riesgo ${ch.key}</span><span>· ${ch.days}d sin actividad</span>`;
    right = `<span class="badge ${ch.cls}">${ch.key}</span>`;
  } else if(mode==='pay'){
    meta = `<span>${c.plan}</span><span>· $${c.fee}/mes</span>`;
    right = `<span class="badge ${ps.cls}">${ps.label}</span>`;
  } else if(mode==='health'){
    const a = healthAlerts(c)[0];
    meta = `<span style="color:#FF8A8A">${a.text.replace(/<[^>]+>/g,'')}</span>`;
    right = `<span class="badge red">${healthAlerts(c).length} alerta${healthAlerts(c).length>1?'s':''}</span>`;
  } else if(mode==='level'){
    const p = progress(c);
    meta = `<span>Grasa ${p.fat>0?'+':''}${p.fat}%</span><span>· Músculo ${p.muscle>0?'+':''}${p.muscle}kg</span>`;
    right = `<span class="badge ${lv.cls}">${lv.icon} ${lv.key}</span>`;
  } else if(mode==='routine'){
    meta = `<span>${c.objective}</span>`;
    right = `<span class="badge violet">Asignar</span>`;
  } else {
    meta = `<span>${c.plan}</span><span>· ${c.modality}</span>`;
  }
  return `
    <div class="client-row" data-action="open" data-id="${c.id}">
      <div class="avatar" style="background:${avatarColor(c.id)}">${initials(c.name)}</div>
      <div class="info">
        <div class="name">${c.name}</div>
        <div class="meta">${meta}</div>
      </div>
      ${right}
    </div>`;
}

/* --- Rutinas: editor --- */
function startEditor(kind, refId, back){
  if(kind==='template'){
    const t = refId ? state.templates.find(x=>x.id===refId) : null;
    state.editing = {
      kind, refId: refId||null, back: back||'routines',
      data: t ? deepCopy(t) : {name:'', goal:'', days:[{name:'Día 1', items:[]}]},
    };
  } else {
    const c = state.clients.find(x=>x.id===refId);
    state.editing = {kind:'client', refId, back:'detail', clientName:c.name, data:deepCopy(c.routine)};
  }
  state.view='editor';
  render();
}
function saveEditor(){
  const ed = state.editing;
  const d = ed.data;
  if(!d.name.trim()){ toast('Ponle un nombre a la rutina'); return; }
  if(!d.days.length || d.days.every(x=>!x.items.length)){ toast('Agrega al menos un ejercicio'); return; }
  if(ed.kind==='template'){
    if(ed.refId){
      const i = state.templates.findIndex(t=>t.id===ed.refId);
      state.templates[i] = {...d, id:ed.refId};
    } else {
      const id = state.templates.length ? Math.max(...state.templates.map(t=>t.id))+1 : 1;
      state.templates.push({...d, id});
    }
    state.editing=null; state.view='routines';
    render(); toast('Plantilla guardada');
  } else {
    const c = state.clients.find(x=>x.id===ed.refId);
    c.routine = {...d};
    state.editing=null; state.view='detail'; state.clientId=c.id;
    render(); toast('Rutina actualizada · lista para enviar');
  }
}

  const g=k=>document.getElementById(k);
  const name=g('n-name').value.trim();
  if(!name){ toast('Ingresa el nombre'); return; }
  const id = state.clients.length ? Math.max(...state.clients.map(c=>c.id))+1 : 1;
  state.clients.push({
    id, name, height:parseInt(g('n-height').value)||170,
    plan:g('n-plan').value, modality:g('n-mod').value,
    phone:g('n-phone').value.trim()||'+507 6000-0000', objective:g('n-obj').value||'—',
    fee:parseInt(g('n-fee').value)||120,
    lastActivity:new Date().toISOString(), nextPayment:dAhead(30), consent:true,
    routine:null, readings:[]
  });
  closeModal(); state.view='clients'; render(); toast(`${name} agregado`);
}

/* --- Mensajes (re-enganche / pago) --- */
function msgButtons(id, msg){
  return `
    <div class="fab-row">
      <button class="btn btn-ghost btn-block" data-action="close">Cerrar</button>
      <button class="btn btn-green btn-block" data-action="copy" data-text="${encodeURIComponent(msg)}">Copiar</button>
    </div>
    <button class="btn btn-wa btn-block" style="margin-top:10px" data-action="wa-send" data-id="${id}" data-text="${encodeURIComponent(msg)}">📲 Enviar por WhatsApp</button>`;
}
function modalReengage(id){
  const c = state.clients.find(x=>x.id===id);
  const first = c.name.split(' ')[0];
  const overdue = payStatus(c).key==='vencido';
  const msg = `¡Hola ${first}! 💪 Te noté desconectado esta semana y quiero asegurarme de que todo esté bien. Ya construiste un buen ritmo y no quiero que lo pierdas.${overdue?' Aprovecha para renovar y seguimos sin frenar.':''} ¿Retomamos mañana? Dime qué horario te queda mejor. — CJ FLEXX`;
  openModal(`
    <h2>💬 Mensaje de re-enganche</h2>
    <div class="m-sub">Generado para ${c.name}. Revísalo y envíalo directo a su WhatsApp.</div>
    <div class="msg-preview">${msg}</div>
    ${msgButtons(id, msg)}
  `);
}

function modalPaylink(id){
  const c = state.clients.find(x=>x.id===id);
  const first = c.name.split(' ')[0];
  const overdue = payStatus(c).key==='vencido';
  const msg = overdue
    ? `¡Hola ${first}! Te recuerdo que tu plan venció. Puedes renovar en segundos con Yappy aquí 👉 pago.cjflexx.com/${c.id}  ¡Seguimos! — CJ FLEXX`
    : `¡Hola ${first}! Tu plan se renueva el ${fmtDate(c.nextPayment)}. Cuando quieras adelantarlo, aquí está tu link de Yappy 👉 pago.cjflexx.com/${c.id}  — CJ FLEXX`;
  openModal(`
    <h2>🔗 Link de pago</h2>
    <div class="m-sub">Enlace Yappy listo para enviar a ${c.name}.</div>
    <div class="msg-preview">${msg}</div>
    ${msgButtons(id, msg)}
  `);
}

function modalYappy(id){
  const c = state.clients.find(x=>x.id===id);
  openModal(`
    <h2>Cobrar con Yappy</h2>
    <div class="m-sub">Simulación del flujo — en la app real esto genera una solicitud de pago verdadera.</div>
    <div class="yappy-sim">
      <div class="y-logo">Yappy</div>
      <div class="y-amount">$${c.fee}.00</div>
      <div class="y-note">Solicitud para ${c.name}</div>
    </div>
    <p style="font-size:12.5px;color:var(--dim);margin-bottom:14px">
      Al confirmar, ${c.name.split(' ')[0]} recibiría la solicitud directo en su celular y aprueba desde su app del banco. Sin tarjetas, sin datos. La comisión de Yappy es ~1% + ITBMS.
    </p>
    <div class="fab-row">
      <button class="btn btn-ghost btn-block" data-action="close">Cancelar</button>
      <button class="btn btn-yappy btn-block" data-action="yappy-confirm" data-id="${id}">Enviar solicitud</button>
    </div>
  `);
}
function yappyConfirm(id){
  const c = state.clients.find(x=>x.id===id);
  c.nextPayment = dAhead(30);
  c.lastActivity = new Date().toISOString();
  closeModal(); render(); toast(`Pago simulado ✓ ${c.name} renovado 30 días`);
}

function copyText(enc){
  const text = decodeURIComponent(enc);
  try{
    navigator.clipboard.writeText(text).then(
      ()=>toast('Copiado al portapapeles'),
      ()=>toast('Selecciona el texto y cópialo')
    );
  }catch(e){ toast('Selecciona el texto y cópialo'); }
}

function resetDemo(){
  if(!confirm('¿Restablecer los datos de ejemplo? Se pierde todo lo que agregaste.')) return;
  localStorage.removeItem(STORAGE_KEY);
  state = {view:'dashboard', clientId:null, editing:null, pick:null, lib:null, ...seedData()};
  closeModal(); render(); toast('Demo restablecido');
}

/* ============================================================
   EVENT DELEGATION
   ============================================================ */
document.addEventListener('click', e=>{
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const a = el.dataset.action;
  const id = el.dataset.id ? parseInt(el.dataset.id) : null;

  switch(a){
    case 'nav': state.view = el.dataset.view; state.editing=null; render(); break;
    case 'open': state.clientId = id; state.view='detail'; render(); break;
    case 'hide-hero': state.showHero=false; render(); break;
    case 'reset': resetDemo(); break;
    case 'new-client': modalNewClient(); break;
    case 'save-client': saveClient(); break;
    case 'add-measure': modalAddMeasure(id); break;
    case 'save-measure': saveMeasure(id); break;
    case 'reengage': modalReengage(id); break;
    case 'paylink': modalPaylink(id); break;
    case 'yappy': modalYappy(id); break;
    case 'yappy-confirm': yappyConfirm(id); break;
    case 'copy': copyText(el.dataset.text); break;
    case 'close': closeModal(); if(state.view==='editor') render(); break;
    case 'backdrop': if(e.target===el){ closeModal(); if(state.view==='editor') render(); } break;

    /* Rutinas */
    case 'new-template': startEditor('template', null); break;
    case 'edit-template': startEditor('template', id); break;
    case 'dup-template': {
      const t = state.templates.find(x=>x.id===id);
      const nid = Math.max(...state.templates.map(x=>x.id))+1;
      state.templates.push({...deepCopy(t), id:nid, name:t.name+' (copia)'});
      render(); toast('Plantilla duplicada');
      break;
    }
    case 'del-template': {
      const t = state.templates.find(x=>x.id===id);
      if(confirm(`¿Eliminar la plantilla "${t.name}"? Las rutinas ya asignadas a clientes no se tocan.`)){
        state.templates = state.templates.filter(x=>x.id!==id);
        render(); toast('Plantilla eliminada');
      }
      break;
    }
    case 'editor-save': saveEditor(); break;
    case 'editor-cancel': {
      const back = state.editing ? state.editing.back : 'routines';
      const cid = state.editing ? state.editing.refId : null;
      state.editing=null;
      if(back==='detail'){ state.view='detail'; state.clientId=cid; } else state.view=back;
      render();
      break;
    }
    case 'ed-add-day':
      state.editing.data.days.push({name:`Día ${state.editing.data.days.length+1}`, items:[]});
      render(); break;
    case 'ed-del-day':
      state.editing.data.days.splice(parseInt(el.dataset.day),1);
      render(); break;
    case 'ed-del-item':
      state.editing.data.days[parseInt(el.dataset.day)].items.splice(parseInt(el.dataset.idx),1);
      render(); break;
    case 'ed-pick': modalPicker(parseInt(el.dataset.day)); break;
    case 'pick-ex': pickExercise(id); renderPicker(); break;
    case 'pick-group': state.pick.group = el.dataset.g; renderPicker(); break;

    /* Asignación y envío */
    case 'assign-routine': modalAssign(id); break;
    case 'assign-pick': assignRoutine(id, parseInt(el.dataset.tpl)); break;
    case 'adjust-routine': startEditor('client', id); break;
    case 'wa-routine': {
      const c = state.clients.find(x=>x.id===id);
      openWA(c.phone, routineText(c));
      c.lastActivity = new Date().toISOString();
      save(); toast('WhatsApp abierto · rutina lista para enviar');
      break;
    }
    case 'wa-send': {
      const c = state.clients.find(x=>x.id===id);
      openWA(c.phone, decodeURIComponent(el.dataset.text));
      save(); toast('WhatsApp abierto');
      break;
    }

    /* Biblioteca */
    case 'library': modalLibrary(); break;
    case 'lib-add': libAdd(); break;
    case 'lib-del':
      state.exercises = state.exercises.filter(x=>x.id!==id);
      save(); renderLibrary(); break;
    case 'lib-group': state.lib.group = el.dataset.g; renderLibrary(); break;
  }
});

// Inputs del editor, buscadores y biblioteca
function onInput(e){
  const t = e.target;
  if(t.id==='pk-q' && state.pick){ state.pick.q = t.value; renderPicker(); return; }
  if(t.id==='lib-q' && state.lib){ state.lib.q = t.value; renderLibrary(); return; }
  const ed = state.editing;
  if(!ed || !t.dataset.ed) return;
  const d = ed.data;
  switch(t.dataset.ed){
    case 'name': d.name = t.value; break;
    case 'goal': d.goal = t.value; break;
    case 'dayname': d.days[parseInt(t.dataset.day)].name = t.value; break;
    case 'item': d.days[parseInt(t.dataset.day)].items[parseInt(t.dataset.idx)][t.dataset.field] = t.value; break;
  }
  save();
}
document.addEventListener('input', onInput);

render();
</script>
</body>
